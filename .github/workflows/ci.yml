name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Activer corepack
        # Avant setup-node, pour que la version de yarn du champ packageManager
        # soit celle utilisée par la détection de cache.
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn build
