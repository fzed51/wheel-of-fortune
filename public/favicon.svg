<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Roue de la fortune">
  <!--
    Source unique des icônes de la PWA : `pwa-assets.config.ts` la décline en
    favicon, icônes 64/192/512, variante maskable, icône Apple et écrans de
    démarrage iOS. Contraintes que ce fichier doit respecter, sous peine de
    faire échouer la génération ou de produire des PNG faux :

    - `viewBox` carré, sinon les déclinaisons non carrées déforment la roue ;
    - aucun texte, aucune police : rien à vectoriser, rien à charger, et donc
      rien qu'Android puisse rogner. La variante maskable subit un masque
      circulaire dont la zone sûre est le disque central à 80 % du côté — un
      libellé en périphérie de roue serait coupé ;
    - aucun `foreignObject`, aucune référence externe ;
    - **aucune couleur en `color(display-p3 …)`** : sharp ne sait pas la lire.
      C'est la raison pour laquelle le `favicon.svg` du template Vite a été
      remplacé au lieu d'être réutilisé — il en était rempli.

    Les couleurs sont copiées des propriétés personnalisées `wof-wheel-*`,
    `wof-primary` et `wof-fg` de `src/index.css` (leurs deux tirets initiaux
    sont omis ici : un commentaire XML interdit deux tirets consécutifs, et
    sharp refuse alors le fichier entier). Une copie de plus, faute de pouvoir
    du CSS dans un SVG statique : même situation que `public/theme-init.js`.
    Elles sont volontairement prises dans la palette **claire**, seule des deux
    qui garde son sens sur le fond d'écran d'un téléphone, quel que soit son
    thème.
  -->
  <circle cx="256" cy="256" r="244" fill="#6d28d9" />
  <g stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <path fill="#fcd34d" d="M256 256 L256 32 A224 224 0 0 1 368 62.01 Z" />
    <path fill="#6ee7b7" d="M256 256 L368 62.01 A224 224 0 0 1 449.99 144 Z" />
    <path fill="#7dd3fc" d="M256 256 L449.99 144 A224 224 0 0 1 480 256 Z" />
    <path fill="#c4b5fd" d="M256 256 L480 256 A224 224 0 0 1 449.99 368 Z" />
    <path fill="#fda4af" d="M256 256 L449.99 368 A224 224 0 0 1 368 449.99 Z" />
    <path fill="#e5e7eb" d="M256 256 L368 449.99 A224 224 0 0 1 256 480 Z" />
    <path fill="#fcd34d" d="M256 256 L256 480 A224 224 0 0 1 144 449.99 Z" />
    <path fill="#6ee7b7" d="M256 256 L144 449.99 A224 224 0 0 1 62.01 368 Z" />
    <path fill="#7dd3fc" d="M256 256 L62.01 368 A224 224 0 0 1 32 256 Z" />
    <path fill="#c4b5fd" d="M256 256 L32 256 A224 224 0 0 1 62.01 144 Z" />
    <path fill="#fda4af" d="M256 256 L62.01 144 A224 224 0 0 1 144 62.01 Z" />
    <path fill="#e5e7eb" d="M256 256 L144 62.01 A224 224 0 0 1 256 32 Z" />
  </g>
  <circle cx="256" cy="256" r="68" fill="#ffffff" stroke="#6d28d9" stroke-width="5" />
  <circle cx="256" cy="256" r="40" fill="#6d28d9" />
  <!-- Le repère, seul élément qui distingue une roue de jeu d'un camembert. -->
  <path fill="#1b1033" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" d="M256 112 L212 8 L300 8 Z" />
</svg>
