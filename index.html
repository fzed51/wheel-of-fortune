<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Aucun `<link rel="icon">` écrit à la main : `pwa-assets.config.ts` les
         injecte tous ici (favicon, icône Apple, écrans de démarrage iOS) depuis
         `public/favicon.svg`. Une balise en dur ferait doublon et finirait par
         pointer une icône que le générateur ne produit plus. -->
    <!-- Ni `maximum-scale` ni `user-scalable=no` : ce serait un échec WCAG 1.4.4. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Contrairement au manifest, `theme-color` accepte `media` : c'est ce qui colore
         la barre d'URL avant que JavaScript ne tourne. `theme-init.js` réécrit les deux. -->
    <meta name="theme-color" content="#faf7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1033" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="La Roue" />
    <title>La Roue de la Fortune</title>
    <!-- Script classique bloquant, placé avant le module : pose `data-theme` avant
         le premier rendu, sinon l'écran flashe en clair. `%BASE_URL%` suivra le
         sous-chemin de déploiement. -->
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
